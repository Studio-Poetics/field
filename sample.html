<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio — Waitlist</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{

--bg:#faf9f6;
--text:#111;
--muted:#666;
--border:#ddd;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{

background:var(--bg);
color:var(--text);

font-family:Inter,sans-serif;

overflow-x:hidden;

}

.hero{

position:relative;

display:flex;

align-items:center;

min-height:100vh;

padding:7vw;

overflow:hidden;

}

/* IMAGE */

.image{

position:absolute;

right:0;

top:0;

width:58%;

height:100%;

overflow:hidden;

pointer-events:none;

}

.image::after{

content:"";

position:absolute;

inset:0;

background:linear-gradient(
90deg,
var(--bg) 0%,
rgba(250,249,246,.75) 12%,
rgba(250,249,246,.25) 22%,
transparent 40%
);

}

.image img{

position:absolute;

right:-8%;

bottom:-5%;

width:95%;

height:110%;

object-fit:cover;

filter:
grayscale(100%)
contrast(1.25)
brightness(.95);

animation:photo 1.8s ease;

}

/* CONTENT */

.content{

position:relative;

z-index:10;

max-width:560px;

}

.logo{

font-size:15px;

font-weight:600;

letter-spacing:.08em;

text-transform:uppercase;

margin-bottom:90px;

display:flex;

align-items:center;

gap:12px;

}

.logo span{

width:14px;

height:14px;

border:2px solid #111;

display:inline-block;

transform:rotate(45deg);

}

h1{

font-family:"Cormorant Garamond",serif;

font-size:clamp(5rem,9vw,8rem);

font-weight:400;

line-height:.88;

letter-spacing:-.05em;

margin-bottom:24px;

animation:fadeUp 1s ease;

}

p{

font-family:"Cormorant Garamond",serif;

font-size:1.6rem;

color:var(--muted);

line-height:1.5;

max-width:380px;

margin-bottom:60px;

animation:fadeUp 1.2s ease;

}

form{

display:flex;

gap:16px;

flex-wrap:wrap;

animation:fadeUp 1.4s ease;

}

input{

width:320px;

height:56px;

padding:0 20px;

background:white;

border:1px solid var(--border);

font-size:15px;

transition:.25s;

outline:none;

}

input:focus{

border-color:#111;

}

button{

height:56px;

padding:0 34px;

background:#111;

color:white;

border:1px solid #111;

cursor:pointer;

font-size:15px;

transition:.25s;

}

button:hover{

background:white;

color:#111;

}

/* Decorative line */

.line{

position:absolute;

left:7vw;

bottom:7vw;

width:90px;

height:1px;

background:#111;

opacity:.2;

}

/* animations */

@keyframes fadeUp{

from{

opacity:0;
transform:translateY(35px);

}

to{

opacity:1;
transform:none;

}

}

@keyframes photo{

from{

opacity:0;

transform:
scale(1.08)
translateX(40px);

}

to{

opacity:1;

transform:
scale(1)
translateX(0);

}

}

/* MOBILE */

@media(max-width:900px){

.hero{

padding:40px 30px;

align-items:flex-start;

padding-top:60px;

}

.image{

opacity:.18;

width:100%;

}

.image::after{

display:none;

}

.image img{

right:-20%;

width:130%;

height:100%;

}

.logo{

margin-bottom:50px;

}

h1{

font-size:4.2rem;

}

p{

font-size:1.3rem;

}

form{

flex-direction:column;

}

input,button{

width:100%;

}

.line{

display:none;

}

}

</style>

</head>

<body>

<section class="hero">

<div class="image">

<img src="tree.jpg" alt="Tree">

</div>

<div class="content">

<div class="logo">

<span></span>

Studio

</div>

<h1>
The waitlist<br>
is now open
</h1>

<p>
Be among the first to experience our next collection of thoughtful digital products.
</p>

<form>

<input
type="email"
placeholder="Enter your email">

<button>
Join Waitlist
</button>

</form>

</div>

<div class="line"></div>

</section>

</body>
</html>
